[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "forgekit"
dynamic = ["version"]
description = "ForgeKit — A powerful modular command-line toolkit for Linux, developers, and system diagnostics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sami Laman", email = "lamansami7@gmail.com" }]
maintainers = [{ name = "Sami Laman", email = "lamansami7@gmail.com" }]
keywords = ["cli", "system", "diagnostics", "devops", "toolkit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.20.1",
    "rich>=13.0.0",
    "psutil>=5.9.8",
    "requests>=2.28.0",
    "tomlkit>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "build>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/lamansami7/ForgeKit"
Repository = "https://github.com/lamansami7/ForgeKit"
Issues = "https://github.com/lamansami7/ForgeKit/issues"
Changelog = "https://github.com/lamansami7/ForgeKit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/lamansami7/ForgeKit/tree/main/docs"

[project.scripts]
forge = "forgekit.cli:app"

[tool.hatch.version]
path = "src/forgekit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/forgekit"]

[tool.hatch.build]
artifacts = ["src/forgekit/resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E741"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src/forgekit"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# Guard against regressions; the suite covers ~90% of statements.
fail_under = 90
